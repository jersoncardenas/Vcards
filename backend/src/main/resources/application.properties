spring.application.name=vcar-api
server.address=${BACKEND_HOST:127.0.0.1}
server.port=${BACKEND_PORT:8000}

# Almacenamiento temporal en memoria, sin PostgreSQL.
# Los datos se eliminan al detener el backend.
spring.datasource.url=jdbc:h2:mem:vcards;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.frontend-url=${FRONTEND_URL:http://localhost:4321}
